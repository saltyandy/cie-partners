<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIE Partners</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <main>
        <!-- Hero Section -->
        <section class="hero">
            <div class="hero-content">
                <img src="./images/logo.svg" alt="CIE Partners Logo" class="logo">
                <h1>Welcome to CIE Partners</h1>
                <p>Your trusted partner for growth and success</p>
            </div>
        </section>

        <!-- Contact Section -->
        <section class="contact">
            <div class="contact-content">
                <h2>Get In Touch</h2>
                <div class="contact-details">
                    <div class="contact-item" data-contact="email">
                        <h3>Email</h3>
                        <p><a href="mailto:contact@ciepartners.com">contact@ciepartners.com</a></p>
                    </div>
                    <div class="contact-item" data-contact="phone">
                        <h3>Phone</h3>
                        <p><a href="tel:+1234567890">+1 (234) 567-890</a></p>
                    </div>
                    <div class="contact-item" data-contact="address">
                        <h3>Address</h3>
                        <p>123 Business Street<br>Suite 100<br>New York, NY 10001</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 CIE Partners. All rights reserved.</p>
    </footer>

    <script src="./js/sanity-client.js"></script>
</body>
</html>
